<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Operation Vijay — Kargil, 1999</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700&family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e0a;
    --ink:#e7e4d8;
    --ink-dim:#a7a695;
    --olive:#4a5240;
    --olive-dim:#2c3227;
    --amber:#c98a3a;
    --steel:#8ba0ad;
    --rust:#a8503d;
    --line: rgba(231,228,216,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #scroll-spacer{ width:100%; height:700vh; position:relative; }
  #stage{
    position:fixed; inset:0; width:100vw; height:100vh; overflow:hidden; z-index:1;
  }
  #canvas-wrap{ position:absolute; inset:0; }
  canvas{ display:block; width:100%; height:100%; }

  /* vignette + grain-ish scrim for cinematic depth */
  #vignette{
    position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 100%);
    z-index:5;
  }
  #scrim-bottom{
    position:absolute; left:0; right:0; bottom:0; height:46vh; pointer-events:none;
    background:linear-gradient(to top, rgba(6,7,5,0.92) 0%, rgba(6,7,5,0.55) 38%, rgba(6,7,5,0) 100%);
    z-index:5;
  }

  /* top HUD bar */
  #hud-top{
    position:absolute; top:0; left:0; right:0; z-index:20;
    display:flex; justify-content:space-between; align-items:center;
    padding:22px 34px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.12em; color:var(--ink-dim);
    text-transform:uppercase;
    opacity:0; transition:opacity 1s ease;
  }
  #hud-top.visible{ opacity:1; }
  #hud-top .brand{ color:var(--ink); font-weight:500; }
  #hud-top .readout{ display:flex; gap:28px; }
  #hud-top .readout span b{ color:var(--amber); font-weight:500; }

  /* perspective select — floating labels inside the opening scene */
  #perspective-layer{
    position:absolute; inset:0; z-index:15; pointer-events:none;
  }
  .persp-pick{
    position:absolute; pointer-events:auto; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    transition: opacity 0.9s ease, transform 0.9s ease;
    user-select:none;
  }
  .persp-pick .ring{
    width:14px; height:14px; border-radius:50%;
    border:1px solid var(--ink-dim);
    position:relative;
    transition: border-color 0.4s ease, box-shadow 0.4s ease;
  }
  .persp-pick .ring::after{
    content:''; position:absolute; inset:4px; border-radius:50%;
    background:var(--ink-dim); opacity:0.5; transition:all 0.4s ease;
  }
  .persp-pick .label{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.18em;
    text-transform:uppercase; color:var(--ink-dim); transition:color 0.4s ease;
    white-space:nowrap;
  }
  .persp-pick .sub{
    font-family:'IBM Plex Mono', monospace; font-size:9.5px; letter-spacing:0.1em;
    color:var(--ink-dim); opacity:0.55; text-transform:none;
  }
  .persp-pick:hover .ring{ border-color:var(--amber); }
  .persp-pick:hover .ring::after{ background:var(--amber); opacity:1; box-shadow:0 0 12px var(--amber); }
  .persp-pick:hover .label{ color:var(--amber); }
  .persp-pick.selected .ring{ border-color:var(--amber); }
  .persp-pick.selected .ring::after{ background:var(--amber); opacity:1; box-shadow:0 0 14px var(--amber); }
  .persp-pick.selected .label{ color:var(--amber); }
  .persp-pick.faded{ opacity:0.28; transform:scale(0.94); }
  .persp-pick.gone{ opacity:0; transform:scale(0.8) translateY(-8px); pointer-events:none; }

  #pick-hint{
    position:absolute; left:50%; bottom:9vh; transform:translateX(-50%);
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.16em;
    color:var(--ink-dim); text-transform:uppercase; text-align:center;
    opacity:0; transition:opacity 1s ease 0.4s;
    z-index:15;
  }
  #pick-hint.visible{ opacity:0.75; }
  #pick-hint .arrow{ display:block; margin-top:10px; font-size:14px; animation:bob 2.2s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(6px); } }

  /* perspective switcher (small, appears once selection made) */
  #switcher{
    position:absolute; top:22px; right:34px; z-index:30;
    display:flex; gap:8px; opacity:0; pointer-events:none;
    transition:opacity 0.65s ease, transform 0.65s ease;
    transform:translateY(-6px);
    font-family:'IBM Plex Mono', monospace;
  }
  #switcher.visible{ opacity:1; pointer-events:auto; transform:translateY(0); }
  #switcher.visible button{ pointer-events:auto; touch-action:manipulation; }
  #switcher button{
    position:relative; isolation:isolate;
    background:rgba(8,12,16,0.30); border:0; color:var(--ink-dim);
    font-family:inherit; font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
    padding:9px 8px 11px; cursor:pointer; overflow:visible;
    transition:color 0.25s ease, transform 0.25s ease, text-shadow 0.25s ease;
  }
  #switcher button::before{
    content:''; position:absolute; left:8px; right:8px; bottom:5px; height:1px;
    background:var(--amber); transform:scaleX(0); transform-origin:center;
    transition:transform 0.28s cubic-bezier(.2,.8,.2,1), box-shadow 0.28s ease;
  }
  #switcher button::after{
    content:''; position:absolute; left:18%; right:18%; bottom:4px; height:12px;
    background:radial-gradient(ellipse at center, rgba(245,180,70,.24), transparent 68%);
    opacity:0; filter:blur(5px); transition:opacity 0.28s ease; pointer-events:none; z-index:-1;
  }
  #switcher button:hover{
    color:var(--ink); transform:translateY(-1px);
    text-shadow:0 0 10px rgba(245,180,70,.20);
  }
  #switcher button:hover::before{
    transform:scaleX(1); box-shadow:0 0 8px var(--amber);
  }
  #switcher button:hover::after{ opacity:1; }
  #switcher button.active{
    color:var(--amber); text-shadow:0 0 12px rgba(245,180,70,.26);
  }
  #switcher button.active::before{
    transform:scaleX(1); box-shadow:0 0 9px var(--amber);
  }
  #switcher button.active::after{ opacity:1; }
  #switcher button.is-clicked{ animation:perspectiveClick 0.55s cubic-bezier(.2,.8,.2,1); }
  @keyframes perspectiveClick{
    0%{ transform:scale(1); }
    35%{ transform:scale(0.96); }
    68%{ transform:scale(1.035); }
    100%{ transform:scale(1); }
  }

  /* narrative text panel */
  #narrative{
    position:absolute; left:0; bottom:0; z-index:18;
    width:100%; padding:0 34px 8vh 34px;
    pointer-events:none;
  }
  #narrative-inner{ max-width:640px; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.22em;
    color:var(--amber); text-transform:uppercase; margin-bottom:14px;
    opacity:0; transform:translateY(10px); transition:opacity 0.8s ease, transform 0.8s ease;
  }
  h1.scene-title{
    font-family:'Big Shoulders Display', sans-serif; font-weight:700;
    font-size:clamp(34px, 5.6vw, 68px); line-height:0.96; letter-spacing:0.01em;
    text-transform:uppercase; color:var(--ink); margin-bottom:16px;
    opacity:0; transform:translateY(14px); transition:opacity 0.9s ease 0.05s, transform 0.9s ease 0.05s;
  }
  p.scene-body{
    font-family:'IBM Plex Sans', sans-serif; font-weight:300; font-size:15.5px; line-height:1.62;
    color:var(--ink-dim); max-width:520px;
    opacity:0; transform:translateY(10px); transition:opacity 0.9s ease 0.12s, transform 0.9s ease 0.12s;
  }
  .scene-date{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.1em;
    color:var(--steel); margin-top:16px;
    opacity:0; transition:opacity 0.9s ease 0.2s;
  }
  #narrative.show .eyebrow,
  #narrative.show h1.scene-title,
  #narrative.show p.scene-body,
  #narrative.show .scene-date{ opacity:1; transform:translateY(0); }

  /* scroll progress rail */
  #rail{
    position:absolute; right:26px; top:50%; transform:translateY(-50%); z-index:18;
    height:34vh; width:1px; background:var(--line);
    opacity:0; transition:opacity 1s ease;
  }
  #rail.visible{ opacity:1; }
  #rail .fill{ position:absolute; top:0; left:0; width:100%; background:var(--amber); height:0%; box-shadow:0 0 8px var(--amber); }
  #rail .tick{
    position:absolute; right:10px; transform:translateY(-50%);
    font-family:'IBM Plex Mono', monospace; font-size:9px; letter-spacing:0.1em;
    color:var(--ink-dim); white-space:nowrap; text-transform:uppercase; opacity:0.6;
  }

  /* location labels (projected) */
  .loc-label{
    position:absolute; z-index:12; pointer-events:none;
    transform:translate(-50%,-100%);
    font-family:'IBM Plex Mono', monospace;
    text-align:center; white-space:nowrap;
    transition: opacity 0.6s ease;
  }
  .loc-label .dot{
    width:6px; height:6px; border-radius:50%; margin:0 auto 6px auto;
    background:var(--ink-dim); box-shadow:0 0 0 rgba(0,0,0,0);
    transition: all 0.6s ease;
  }
  .loc-label .name{
    font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-dim);
    transition:color 0.6s ease, font-size 0.6s ease;
  }
  .loc-label .tag{
    font-size:8.5px; letter-spacing:0.1em; color:var(--amber); opacity:0.85; margin-top:2px;
  }
  .loc-label.tier-context .dot{ background:var(--steel); }
  .loc-label.tier-context .name{ color:var(--steel); }
  .loc-label.tier-objective .dot{ background:var(--amber); box-shadow:0 0 8px var(--amber); }
  .loc-label.tier-objective .name{ color:var(--amber); font-size:11.5px; }
  .loc-label.tier-secured .dot{ background:#cdbf8d; box-shadow:0 0 8px #cdbf8d; }
  .loc-label.tier-secured .name{ color:var(--ink); }

  #intro-overlay{
    position:absolute; inset:0; z-index:14; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding-top:11vh;
    text-align:center;
    opacity:1; transition:opacity 1.1s ease;
  }
  #intro-overlay .kicker{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.32em;
    color:var(--ink-dim); text-transform:uppercase; margin-bottom:18px;
  }
  #intro-overlay h1{
    font-family:'Big Shoulders Display', sans-serif; font-weight:700;
    font-size:clamp(46px, 9vw, 108px); letter-spacing:0.02em; text-transform:uppercase;
    color:var(--ink); line-height:0.92;
  }
  #intro-overlay .sub{
    font-family:'IBM Plex Mono', monospace; font-size:12.5px; letter-spacing:0.2em;
    color:var(--amber); text-transform:uppercase; margin-top:16px;
  }

  #loading{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px;
    transition:opacity 0.9s ease;
  }
  #loading .bar{ width:220px; height:1px; background:var(--line); position:relative; overflow:hidden; }
  #loading .bar .fill{ position:absolute; left:0; top:0; height:100%; width:0%; background:var(--amber); transition:width 0.2s ease; }
  #loading .txt{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.2em; color:var(--ink-dim); text-transform:uppercase; }

  @media (max-width: 720px){
    #narrative{ padding:0 22px 6vh 22px; }
    p.scene-body{ font-size:14px; }
    #hud-top{ padding:16px 18px; }
    #hud-top .readout{ gap:14px; }
    #hud-top .readout span:nth-child(3){ display:none; }
    #rail{ display:none; }
  }
  @media (prefers-reduced-motion: reduce){
    * { animation:none !important; transition:opacity 0.4s ease !important; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="txt" id="loading-txt">LOADING THEATRE</div>
  <div class="bar"><div class="fill" id="loading-fill"></div></div>
</div>

<div id="stage">
  <div id="canvas-wrap"></div>
  <div id="vignette"></div>
  <div id="scrim-bottom"></div>

  <div id="hud-top">
    <div class="brand">OPERATION VIJAY — KARGIL SECTOR</div>
    <div class="readout">
      <span>SEC <b id="hud-sector">DRAS</b></span>
      <span>ALT <b id="hud-alt">—</b></span>
      <span>PERSPECTIVE <b id="hud-persp">JOINT COMMAND</b></span>
    </div>
  </div>

  <div id="switcher" z-index:300>
    <button type="button" data-p="army" aria-label="Switch to Indian Army perspective">Army</button>
    <button type="button" data-p="airforce" aria-label="Switch to Indian Air Force perspective">Air Force</button>
    <button type="button" data-p="joint" aria-label="Switch to Joint Command perspective">Joint Command</button>
  </div>

  <div id="intro-overlay">
    <div class="kicker">A Scroll-Driven Retelling — Ladakh, 1999</div>
    <h1>Operation<br/>Vijay</h1>
    <div class="sub">Choose how you witness it</div>
  </div>

  <div id="perspective-layer"></div>
  <div id="pick-hint">Select a perspective<span class="arrow">▾</span></div>

  <div id="rail"></div>

  <div id="loc-layer"></div>

  <div id="narrative">
    <div id="narrative-inner">
      <div class="eyebrow" id="n-eyebrow">01 — Opening</div>
      <h1 class="scene-title" id="n-title">The Theatre</h1>
      <p class="scene-body" id="n-body"></p>
      <div class="scene-date" id="n-date"></div>
    </div>
  </div>
</div>

<div id="scroll-spacer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){
  "use strict";

  /* ============================================================
     0. RESEARCHED NARRATIVE DATA (Operation Vijay, May–Jul 1999)
     ============================================================ */
  const SCENES = [
    {
      id:'opening', range:[0.00,0.04],
      eyebrow:'00 — The Theatre', title:'One Battlefield',
      body:'The Kargil sector of Ladakh, along the Line of Control. In the winter of 1998\u201399, this ground was empty of any front line.',
      date:''
    },
    {
      id:'geography', range:[0.04,0.12],
      eyebrow:'01 — Geography', title:'The Corridor',
      body:'National Highway 1D runs through Dras and Kargil \u2014 the only road linking Srinagar to Leh. On either side, ridgelines climb past 5,000 metres, ground so high and so cold both armies had traditionally left it unoccupied through winter.',
      date:'WINTER 1998\u201399'
    },
    {
      id:'infiltration', range:[0.12,0.22],
      eyebrow:'02 — Discovery', title:'The Infiltration',
      body:'Through the winter, Pakistani troops and irregulars crossed the Line of Control and occupied those vacated heights above Dras, Kaksar, Mushkoh and Batalik \u2014 positions overlooking NH1D itself. On 3 May, local shepherds in Batalik reported unusual movement on the ridgelines. By 5 May the Indian Army confirmed a deep, deliberate intrusion.',
      date:'3\u20135 MAY 1999'
    },
    {
      id:'mobilisation', range:[0.22,0.34],
      eyebrow:'03 — Response', title:'Operation Vijay',
      body:'On 10 May the Indian Army launched Operation Vijay to clear the heights. Artillery \u2014 including the Bofors howitzers, capable of high-angle fire into terrain other guns couldn\u2019t reach \u2014 began moving into the valley. On 26 May the Indian Air Force joined with Operation Safed Sagar, striking supply dumps and bunkers at altitudes no air force had fought at before.',
      date:'10 & 26 MAY 1999'
    },
    {
      id:'tololing', range:[0.34,0.50],
      eyebrow:'04 — Turning Point', title:'Tololing',
      body:'Overlooking the highway near Dras, Tololing had to fall before anything else could move. 2 Rajputana Rifles and 18 Grenadiers fought a three-week assault up its exposed slopes, much of it hand-to-hand in darkness. It fell on 13 June \u2014 the first major recapture of the war, and the moment the momentum turned.',
      date:'13 JUNE 1999'
    },
    {
      id:'batalik', range:[0.50,0.60],
      eyebrow:'05 — Expansion', title:'Batalik',
      body:'Batalik\u2019s heights were the most stubbornly held of all. Through June and into July, Indian troops fought to retake the Jubar heights and the ridgelines above Kaksar and Muntho Dhalo \u2014 the enemy\u2019s forward supply base \u2014 closing off any route toward Leh and the Siachen approaches.',
      date:'JUNE\u2013JULY 1999'
    },
    {
      id:'tigerhill', range:[0.60,0.84],
      eyebrow:'06 — Tiger Hill', title:'The Highest Peak',
      body:'At 5,307 metres, Tiger Hill commanded the entire Dras sector. Twenty-two artillery batteries bombarded it for thirteen hours before 18 Grenadiers, with the Sikh and Naga regiments, began a multi-pronged night assault on 3 July. Grenadier Yogendra Singh Yadav, wounded repeatedly, scaled the cliff face to silence a bunker at point-blank range \u2014 an action that earned the Param Vir Chakra. Tiger Hill fell after an eleven-hour battle on 4\u20135 July.',
      date:'3\u20135 JULY 1999'
    },
    {
      id:'victory', range:[0.84,1.00],
      eyebrow:'07 — Kargil Vijay Diwas', title:'Vijay',
      body:'By the fall of Tiger Hill, nearly 80% of the intruded territory had been cleared. Batalik\u2019s heights, the last and most stubborn sector, were secured through early July. On 11 July, following talks between President Clinton and Prime Minister Sharif, Pakistani forces began to withdraw. The war ended on 26 July 1999 \u2014 commemorated since as Kargil Vijay Diwas.',
      date:'11\u201326 JULY 1999'
    }
  ];

  /* ============================================================
     0b. GEOGRAPHIC FRAME
     The COP30 DEM tile covers this exact bounding box. All world
     geometry (terrain + markers) shares this frame, so any future
     location can be placed with nothing more than {lat, lon}.
     ============================================================ */
  const GEO_BOUNDS = { west:75.44986109999999, east:76.44986109999999, south:34.30013889999999, north:34.750138899999996 };
  const WORLD_HALF = 100; // terrain plane spans -100..100 on both axes
  function geoToWorld(lon, lat){
    const u = (lon-GEO_BOUNDS.west)/(GEO_BOUNDS.east-GEO_BOUNDS.west);
    const v = (lat-GEO_BOUNDS.south)/(GEO_BOUNDS.north-GEO_BOUNDS.south);
    return { x: u*WORLD_HALF*2-WORLD_HALF, z: v*WORLD_HALF*2-WORLD_HALF };
  }
  function worldToGeo(x, z){
    const u = (x+WORLD_HALF)/(WORLD_HALF*2);
    const v = (z+WORLD_HALF)/(WORLD_HALF*2);
    return { lon: GEO_BOUNDS.west+u*(GEO_BOUNDS.east-GEO_BOUNDS.west), lat: GEO_BOUNDS.south+v*(GEO_BOUNDS.north-GEO_BOUNDS.south) };
  }

  // Real-world coordinates for every marker. x/z are derived below via
  // geoToWorld — add a new location here with just {lat,lon} and it will
  // be placed correctly on the terrain automatically.
  const LOCATIONS = [
    { id:'mushkoh', name:'Mushkoh Valley', lat:34.4300, lon:75.6300, elevM:3450, perm:true,
      states:[ {r:[0,1], tag:'', tier:'context'} ] },
    { id:'dras', name:'Dras', lat:34.4303, lon:75.7531, elevM:3300, perm:true,
      states:[ {r:[0,1], tag:'Sector HQ', tier:'context'} ] },
    { id:'pt4875', name:'Point 4875', lat:34.4790, lon:75.6950, elevM:4875,
      states:[
        {r:[0.04,0.22], tag:'', tier:'context'},
        {r:[0.22,0.60], tag:'Objective', tier:'objective'},
        {r:[0.60,1.0], tag:'Secured', tier:'secured'}
      ]},
    { id:'tololing', name:'Tololing', lat:34.4550, lon:75.7950, elevM:4900,
      states:[
        {r:[0.04,0.22], tag:'', tier:'context'},
        {r:[0.22,0.34], tag:'Objective', tier:'objective'},
        {r:[0.34,1.0], tag:'Recaptured — 13 Jun', tier:'secured'}
      ]},
    { id:'muntho', name:'Muntho Dhalo', lat:34.6500, lon:76.2500, elevM:4300,
      states:[
        {r:[0.04,0.22], tag:'', tier:'context'},
        {r:[0.22,0.60], tag:'Supply base', tier:'objective'},
        {r:[0.60,0.84], tag:'Struck by IAF', tier:'objective'},
        {r:[0.84,1.0], tag:'Cleared', tier:'secured'}
      ]},
    { id:'tigerhill', name:'Tiger Hill', lat:34.4838, lon:75.6617, elevM:5307,
      states:[
        {r:[0.04,0.22], tag:'', tier:'context'},
        {r:[0.22,0.60], tag:'Objective', tier:'objective'},
        {r:[0.60,0.84], tag:'Under assault', tier:'objective'},
        {r:[0.84,1.0], tag:'Recaptured — 4–5 Jul', tier:'secured'}
      ]},
    { id:'kargil', name:'Kargil', lat:34.5594, lon:76.1256, elevM:2676, perm:true,
      states:[ {r:[0,1], tag:'Town', tier:'context'} ] },
    { id:'kaksar', name:'Kaksar', lat:34.6100, lon:76.0300, elevM:3700,
      states:[
        {r:[0.04,0.50], tag:'', tier:'context'},
        {r:[0.50,0.60], tag:'Objective', tier:'objective'},
        {r:[0.60,1.0], tag:'Secured', tier:'secured'}
      ]},
    { id:'batalik', name:'Jubar Heights, Batalik', lat:34.7000, lon:76.2800, elevM:5000,
      states:[
        {r:[0.04,0.50], tag:'', tier:'context'},
        {r:[0.50,0.84], tag:'Objective', tier:'objective'},
        {r:[0.84,1.0], tag:'Secured — 9 Jul', tier:'secured'}
      ]}
  ];
  // Derive world x/z from lat/lon so markers land on their true geographic spot.
  LOCATIONS.forEach(l=>{ const w = geoToWorld(l.lon, l.lat); l.x = w.x; l.z = w.z; });

  const ELEV_SCALE = 1/400; // metres -> world units

  /* ============================================================
     1. THREE.JS SETUP
     ============================================================ */
  const wrap = document.getElementById('canvas-wrap');
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0b0e0a, 0.0105);

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.5, 900);

  function hash(x,z){
    const s = Math.sin(x*127.1 + z*311.7)*43758.5453123;
    return s - Math.floor(s);
  }
  function noise2(x,z){
    const xi=Math.floor(x), zi=Math.floor(z);
    const xf=x-xi, zf=z-zi;
    const a=hash(xi,zi), b=hash(xi+1,zi), c=hash(xi,zi+1), d=hash(xi+1,zi+1);
    const u = xf*xf*(3-2*xf), v = zf*zf*(3-2*zf);
    return a*(1-u)*(1-v) + b*u*(1-v) + c*(1-u)*v + d*u*v;
  }
  function fbm(x,z,octaves){
    let total=0, amp=0.5, freq=1, sum=0;
    for(let i=0;i<octaves;i++){
      total += noise2(x*freq, z*freq)*amp;
      sum += amp;
      amp*=0.5; freq*=2.15;
    }
    return total/sum;
  }

  function decodeDEM(b64){
    const bin = atob(b64);
    const buf = new ArrayBuffer(bin.length);
    const view = new Uint8Array(buf);
    for(let i=0;i<bin.length;i++) view[i] = bin.charCodeAt(i);
    return new Uint16Array(buf);
  }
  const DEM = decodeDEM(DEM_B64); // row-major, row0 = south, col0 = west

  // sample real elevation (metres) at normalized u,v in [0,1] (u:west->east, v:south->north)
  function demMetres(u,v){
    u = Math.max(0, Math.min(1,u));
    v = Math.max(0, Math.min(1,v));
    const fx = u*(DEM_GRID-1), fy = v*(DEM_GRID-1);
    const x0 = Math.floor(fx), y0 = Math.floor(fy);
    const x1 = Math.min(DEM_GRID-1, x0+1), y1 = Math.min(DEM_GRID-1, y0+1);
    const tx = fx-x0, ty = fy-y0;
    const g = (xi,yi)=> DEM[yi*DEM_GRID+xi] / 65535;
    const a = g(x0,y0), b = g(x1,y0), c = g(x0,y1), d = g(x1,y1);
    const n = a*(1-tx)*(1-ty) + b*tx*(1-ty) + c*(1-tx)*ty + d*tx*ty;
    return DEM_VMIN + n*(DEM_VMAX-DEM_VMIN);
  }

  // world x,z in [-100,100] map directly onto the DEM's full geographic extent
  // via the same geoToWorld frame used for markers (x: west->east, z: south->north)
  function heightAt(x,z){
    const u = (x+WORLD_HALF)/(WORLD_HALF*2);
    const v = (z+WORLD_HALF)/(WORLD_HALF*2);
    return demMetres(u,v) * ELEV_SCALE;
  }

  // orientation for the PlaneGeometry UVs after the X rotation.

      uLightDir: { value: new THREE.Vector3(-0.5,0.75,-0.25).normalize() },
      uFocus: { value: new THREE.Vector3(0,0,0) },
      uFocusR: { value: 0.0 },
      uFocusColor: { value: new THREE.Color(0xc98a3a) },
      uFogColor: { value: new THREE.Color(0x0b0e0a) },
      uFogDensity: { value: 0.0105 },
      uTime: { value: 0 }
    },
    vertexShader: `
      varying vec3 vWorldPos;
      varying vec3 vNormal;
      varying vec2 vUv;
      void main(){
        vec4 wp = modelMatrix * vec4(position,1.0);
        vWorldPos = wp.xyz;
        vNormal = normalize(mat3(modelMatrix) * normal);
        vUv = uv;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: `
      uniform sampler2D uMap;
      uniform vec3 uLightDir, uFogColor, uFocusColor;
      uniform vec3 uFocus;
      uniform float uFocusR, uFogDensity, uTime;
      varying vec3 vWorldPos;
      varying vec3 vNormal;
      varying vec2 vUv;

      void main(){

        vec3 col = texture2D(uMap, vUv).rgb;

        // Gentle documentary lighting; preserve recognisable satellite colours.
        vec3 n = normalize(vNormal);
        float diff = max(dot(n, uLightDir), 0.0);
        float light = 0.72 + diff*0.34;
        col *= light;

        // Restrained objective cue, kept subtle so the real imagery remains primary.
        float fd = distance(vWorldPos.xz, uFocus.xz);
        float glow = (1.0 - smoothstep(0.0, uFocusR, fd));

      }
    `

  // Each source model is loaded into its own wrapper. The wrapper is what
  // follows the cinematic flight path, so source-model orientation/scale
  // corrections stay isolated and easy to tune.
  function prepareAircraft(model, key){
    const root = new THREE.Group();
    root.add(model);

    model.traverse((obj)=>{
      if(obj.isMesh){
        obj.castShadow = false;
        obj.receiveShadow = false;
        if(obj.material && obj.material.map) obj.material.map.anisotropy = 4;
      }
    });

    // Normalize every model around its geometric centre so both downloaded
    // aircraft behave predictably despite different authoring coordinates.
    const box = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3();
    const center = new THREE.Vector3();
    box.getSize(size);
    box.getCenter(center);
    model.position.sub(center);

    const longest = Math.max(size.x,size.y,size.z) || 1;
    const targetLength = 6.0; // visual size in this world
    const scale = targetLength / longest;
    model.scale.setScalar(scale);

    // Source-specific axis correction. Both remain intentionally explicit
    // so they can be adjusted without touching the flight system.
    if(key === 'mig'){
      // MiG source has its fuselage primarily along local Y.
      model.rotation.set(Math.PI/2, 0, 0);
    }else if(key === 'mirage'){
      // Mirage source is primarily along local X.
      model.rotation.set(0, Math.PI/2, 0);
    }

    root.visible = false;
    aircraftRoot.add(root);
    aircraft[key] = root;
    aircraftLoaded[key] = true;
  }

  const FLIGHT_BEATS = [

  function updateAircraft(curT, time){
    let beat = null;
    for(const candidate of FLIGHT_BEATS){
      if(curT>=candidate.range[0] && curT<=candidate.range[1]){
        beat = candidate;
        break;
      }
    }

    Object.keys(aircraft).forEach((key)=>{
      if(aircraft[key]) aircraft[key].visible = false;
    });
    if(!beat || !aircraft[beat.model]) return;

    const u = (curT-beat.range[0])/(beat.range[1]-beat.range[0]);
    const p0=beat.path[0], p1=beat.path[1];
    const x = p0[0]+(p1[0]-p0[0])*u;
    const z = p0[2]+(p1[2]-p0[2])*u;
    const y = heightAt(x,z) + beat.altitude + Math.sin(u*Math.PI)*4;

    const craft = aircraft[beat.model];
    craft.position.set(x,y,z);
    craft.rotation.set(0, Math.atan2(p1[0]-p0[0], p1[2]-p0[2]), Math.sin(time*2)*0.035);
    craft.visible = true;
  }

  function smootherstep(x){ x=Math.max(0,Math.min(1,x)); return x*x*x*(x*(x*6-15)+10); }

  function evalPath(path, t){
    if(t<=path[0].t) return path[0];
    for(let i=0;i<path.length-1;i++){
      const a=path[i], b=path[i+1];
      if(t>=a.t && t<=b.t){
        const u = smootherstep((t-a.t)/(b.t-a.t || 1));
        return {
          pos:[0,1,2].map(k=>a.pos[k]+(b.pos[k]-a.pos[k])*u),
          tgt:[0,1,2].map(k=>a.tgt[k]+(b.tgt[k]-a.tgt[k])*u),
          fov: a.fov+(b.fov-a.fov)*u
        };
      }
    }
    return path[path.length-1];
  }

  function requestPerspective(key, ev){
    if(ev){
      ev.preventDefault();
      ev.stopPropagation();

  switcherEl.querySelectorAll('button').forEach(b=>{

  function selectPerspective(key){
    if(!PATHS[key]) return false;

    const previous = currentPerspective;
    const changed = previous !== key;

    // Always give the clicked control feedback, even if it is already active.
    switcherEl.querySelectorAll('button').forEach(b=>{
      const active = b.dataset.p===key;
      b.classList.toggle('active', active);
      if(active){
        b.classList.remove('is-clicked');
        void b.offsetWidth; // restart the subtle click animation
        b.classList.add('is-clicked');
      }
    });

    // the destination path against the LIVE curT every frame, so scrolling
    // cannot cause a jump when the perspective blend completes.
    // Capture the smoothed camera state, not the rendered camera (which has
    // ambient sway added to it). This makes every switch deterministic.
    if(changed || !perspectiveBlend){

        start: performance.now(),
        duration: 900,
        fromPos: smoothed.pos.clone(),
        fromTgt: smoothed.tgt.clone(),
        fromFov: smoothed.fov,

      key==='army' ? 'INDIAN ARMY' : key==='airforce' ? 'INDIAN AIR FORCE' : 'JOINT COMMAND';

      p.el.classList.toggle('faded', p.key!==key);

  const _v = new THREE.Vector3();
  function updateLocationLabels(t){
    let focusPoint = null, focusR = 0;
    for(const l of LOCATIONS){
      const st = l.states.find(s=> t>=s.r[0] && t<s.r[1]) || l.states[l.states.length-1];
      const y = heightAt(l.x,l.z);
      _v.set(l.x, y+1.2, l.z).project(camera);
      const inView = _v.z < 1 && _v.z > -1;
      const sx = (_v.x*0.5+0.5)*window.innerWidth;
      const sy = (1-(_v.y*0.5+0.5))*window.innerHeight;
      const dist = camera.position.distanceTo(new THREE.Vector3(l.x,y,l.z));
      const visible = inView && st && (st.tier!=='context' || true);
      const nearOK = dist < 130;
      if(visible && nearOK && sx>-100 && sx<window.innerWidth+100){
        l.el.style.opacity = st.tier==='context' && !l.perm ? '0.55' : '1';
        l.el.style.left = sx+'px';
        l.el.style.top = sy+'px';
        l.el.className = 'loc-label tier-'+st.tier;
        l.el.querySelector('.tag').textContent = st.tag||'';
      } else {
        l.el.style.opacity = '0';
      }
      if(st.tier==='objective'){
        focusPoint = l; focusR = 22;
      }
    }
    if(focusPoint){
      terrainMat.uniforms.uFocus.value.set(focusPoint.x, 0, focusPoint.z);
      terrainMat.uniforms.uFocusR.value += (focusR - terrainMat.uniforms.uFocusR.value)*0.06;
    } else {
      terrainMat.uniforms.uFocusR.value += (0 - terrainMat.uniforms.uFocusR.value)*0.06;
    }
  }

  /* ============================================================
     9. NARRATIVE TEXT SYNC
     ============================================================ */
  const narrEl = document.getElementById('narrative');
  const elEyebrow = document.getElementById('n-eyebrow');
  const elTitle = document.getElementById('n-title');
  const elBody = document.getElementById('n-body');
  const elDate = document.getElementById('n-date');
  let activeSceneId = null;

  function currentScene(t){
    return SCENES.find(s=> t>=s.range[0] && t<s.range[1]) || SCENES[SCENES.length-1];
  }
  function updateNarrative(t){
    const s = currentScene(t);
    if(s.id !== activeSceneId){
      activeSceneId = s.id;
      narrEl.classList.remove('show');
      setTimeout(()=>{
        elEyebrow.textContent = s.eyebrow;
        elTitle.textContent = s.title;
        elBody.textContent = s.body;
        elDate.textContent = s.date;
        if(s.id==='opening'){ narrEl.style.visibility='hidden'; } else { narrEl.style.visibility='visible'; }
        void narrEl.offsetWidth;
        narrEl.classList.add('show');
      }, s.id==='opening'?0:180);
    }
  }

  /* ============================================================
     10. HUD + RAIL
     ============================================================ */
  const railEl = document.getElementById('rail');
  const railFillEl = document.createElement('div');
  railFillEl.className = 'fill';
  railEl.appendChild(railFillEl);
  const railFill = railFillEl;
  const hudTop = document.getElementById('hud-top');
  const hudSector = document.getElementById('hud-sector');
  const hudAlt = document.getElementById('hud-alt');
  function nearestSector(x,z){
    let best=null, bd=1e9;
    for(const l of LOCATIONS){
      const d = Math.hypot(x-l.x, z-l.z);
      if(d<bd){ bd=d; best=l; }
    }
    return best ? best.name : '—';
  }

  /* ============================================================
     11. INTRO OVERLAY FADE + LOADING
     ============================================================ */
  const introOverlay = document.getElementById('intro-overlay');
  const pickHint = document.getElementById('pick-hint');
  const rail = document.getElementById('rail');
  SCENES.forEach((s)=>{
    const t = document.createElement('div');
    t.className='tick';
    t.textContent = s.eyebrow.replace(/^\d+\s*—\s*/,'').toUpperCase();
    t.style.top = (s.range[0]*100)+'%';
    rail.appendChild(t);
  });

  /* ============================================================
     12. RENDER LOOP
     ============================================================ */
  let clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    terrainMat.uniforms.uTime.value += dt;

    curT += (targetT-curT)*Math.min(1, dt*4.2);

    const pathKey = currentPerspective || 'joint';
    const frame = evalPath(PATHS[pathKey], curT);
    const desiredPos = new THREE.Vector3(...frame.pos);
    const desiredTgt = new THREE.Vector3(...frame.tgt);
    let desiredFov = frame.fov;

    if(perspectiveBlend){
      const u = Math.min(1, (performance.now()-perspectiveBlend.start)/perspectiveBlend.duration);
      const e = smootherstep(u);

      // Destination stays tied to the current story progress while blending.
      const liveTo = evalPath(PATHS[perspectiveBlend.toKey], curT);
      const livePos = new THREE.Vector3(...liveTo.pos);
      const liveTgt = new THREE.Vector3(...liveTo.tgt);

      desiredPos.copy(perspectiveBlend.fromPos).lerp(livePos, e);
      desiredTgt.copy(perspectiveBlend.fromTgt).lerp(liveTgt, e);
      desiredFov = perspectiveBlend.fromFov + (liveTo.fov-perspectiveBlend.fromFov)*e;
      if(u>=1){
        // Finish exactly on the destination path so the change cannot visually
        // revert to the previous path on the next frame.
        smoothed.pos.copy(livePos);
        smoothed.tgt.copy(liveTgt);
        smoothed.fov = liveTo.fov;
        perspectiveBlend = null;
      }
    }

    smoothed.pos.lerp(desiredPos, Math.min(1,dt*4.2));
    smoothed.tgt.lerp(desiredTgt, Math.min(1,dt*4.2));
    smoothed.fov += (desiredFov - smoothed.fov)*Math.min(1,dt*4.2);

    // tiny ambient handheld sway, independent of scroll
    const time = performance.now()*0.00016;
    const sway = new THREE.Vector3(Math.sin(time*1.3)*0.35, Math.cos(time*1.05)*0.22, Math.sin(time*0.8)*0.3);

    camera.position.copy(smoothed.pos).add(sway);
    // Keep both camera and look target above the real DEM.
    const clearanceKey = perspectiveBlend?.toKey || pathKey;
    const clearance = { army:2.2, joint:7.0, airforce:14.0 }[clearanceKey] ?? 7.0;
    const targetClearance = { army:0.8, joint:1.5, airforce:2.0 }[clearanceKey] ?? 1.5;
    const groundY = heightAt(camera.position.x, camera.position.z);
    if(camera.position.y < groundY + clearance) camera.position.y = groundY + clearance;
    const safeTarget = smoothed.tgt.clone();
    safeTarget.y = Math.max(safeTarget.y, heightAt(safeTarget.x, safeTarget.z) + targetClearance);
    camera.lookAt(safeTarget);
    camera.fov = smoothed.fov;
    camera.updateProjectionMatrix();

    // opening overlay + pick UI visibility
    const introOpacity = 1 - smootherstep(curT/0.045);
    introOverlay.style.opacity = introOpacity;
    introOverlay.style.pointerEvents = curT<0.04 ? 'auto':'none';
    if(curT>0.05){
      // If the user starts scrolling without choosing, Joint Command becomes
      // the default and the compact switcher remains available.
      if(!currentPerspective) selectPerspective('joint');
      pickHint.classList.remove('visible');
      document.querySelectorAll('.persp-pick').forEach(el=> el.classList.add('gone'));
      switcherEl.classList.add('visible');
    } else if(currentPerspective){
      document.querySelectorAll('.persp-pick').forEach(el=> el.classList.remove('gone'));
    }
    hudTop.classList.toggle('visible', curT>0.015);
    rail.classList.toggle('visible', curT>0.03);
    railFill.style.height = (curT*100)+'%';

    updateNarrative(curT);
    updateLocationLabels(curT);

    // actual uploaded aircraft
    updateAircraft(curT, time);

    // HUD readouts
    hudSector.textContent = nearestSector(camera.position.x, camera.position.z).toUpperCase();
    hudAlt.textContent = Math.round(demMetres((camera.position.x+WORLD_HALF)/(WORLD_HALF*2), (camera.position.z+WORLD_HALF)/(WORLD_HALF*2))).toLocaleString()+' M';

    renderer.render(scene, camera);
  }

  /* ============================================================
     13. BOOT
     ============================================================ */
  function boot(){
    updateScrollTarget();
    animate();
    const loading = document.getElementById('loading');
    loading.style.opacity='0';
    setTimeout(()=> loading.style.display='none', 950);
  }

  // Loading progress waits for the actual satellite texture.
  const fill = document.getElementById('loading-fill');
  let p=0;
  const iv = setInterval(()=>{
    if(terrainTextureFailed){
      clearInterval(iv);
      const loading = document.getElementById('loading');
      loading.innerHTML = '<div style="max-width:520px;text-align:center;font-family:IBM Plex Mono,monospace;color:#e7e4d8;line-height:1.6">SATELLITE TEXTURE FAILED TO LOAD<br><span style="color:#a7a695">Keep kargil_satellite_8192.jpg beside this HTML file and serve the folder with a local web server.</span></div>';
      return;
    }
    const cap = terrainTextureReady ? 100 : 92;
    p += (cap-p)*0.16 + (terrainTextureReady ? 2.5 : 0.4);
    p = Math.min(cap,p);
    fill.style.width = p+'%';
    if(terrainTextureReady && p>=99.5){
      p=100; fill.style.width='100%'; clearInterval(iv); boot();
    }
  }, 60);

})();
</script>
</body>
</html>
