<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Operation Vijay — Kargil, 1999</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700&family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e0a;
    --ink:#e7e4d8;
    --ink-dim:#a7a695;
    --olive:#4a5240;
    --olive-dim:#2c3227;
    --amber:#c98a3a;
    --steel:#8ba0ad;
    --rust:#a8503d;
    --line: rgba(231,228,216,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #scroll-spacer{ width:100%; height:700vh; position:relative; }
  #stage{
    position:fixed; inset:0; width:100vw; height:100vh; overflow:hidden; z-index:1;
  }
  #canvas-wrap{ position:absolute; inset:0; }
  canvas{ display:block; width:100%; height:100%; }

  /* vignette + grain-ish scrim for cinematic depth */
  #vignette{
    position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 100%);
    z-index:5;
  }
  #scrim-bottom{
    position:absolute; left:0; right:0; bottom:0; height:46vh; pointer-events:none;
    background:linear-gradient(to top, rgba(6,7,5,0.92) 0%, rgba(6,7,5,0.55) 38%, rgba(6,7,5,0) 100%);
    z-index:5;
  }

  /* top HUD bar */
  #hud-top{
    position:absolute; top:0; left:0; right:0; z-index:20;
    display:flex; justify-content:space-between; align-items:center;
    padding:22px 34px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.12em; color:var(--ink-dim);
    text-transform:uppercase;
    opacity:0; transition:opacity 1s ease;
  }
  #hud-top.visible{ opacity:1; }
  #hud-top .brand{ color:var(--ink); font-weight:500; }
  #hud-top .readout{ display:flex; gap:28px; }
  #hud-top .readout span b{ color:var(--amber); font-weight:500; }

  /* perspective select — floating labels inside the opening scene */
  #perspective-layer{
    position:absolute; inset:0; z-index:15; pointer-events:none;
  }
  .persp-pick{
    position:absolute; pointer-events:auto; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    transition: opacity 0.9s ease, transform 0.9s ease;
    user-select:none;
  }
  .persp-pick .ring{
    width:14px; height:14px; border-radius:50%;
    border:1px solid var(--ink-dim);
    position:relative;
    transition: border-color 0.4s ease, box-shadow 0.4s ease;
  }
  .persp-pick .ring::after{
    content:''; position:absolute; inset:4px; border-radius:50%;
    background:var(--ink-dim); opacity:0.5; transition:all 0.4s ease;
  }
  .persp-pick .label{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.18em;
    text-transform:uppercase; color:var(--ink-dim); transition:color 0.4s ease;
    white-space:nowrap;
  }
  .persp-pick .sub{
    font-family:'IBM Plex Mono', monospace; font-size:9.5px; letter-spacing:0.1em;
    color:var(--ink-dim); opacity:0.55; text-transform:none;
  }
  .persp-pick:hover .ring{ border-color:var(--amber); }
  .persp-pick:hover .ring::after{ background:var(--amber); opacity:1; box-shadow:0 0 12px var(--amber); }
  .persp-pick:hover .label{ color:var(--amber); }
  .persp-pick.selected .ring{ border-color:var(--amber); }
  .persp-pick.selected .ring::after{ background:var(--amber); opacity:1; box-shadow:0 0 14px var(--amber); }
  .persp-pick.selected .label{ color:var(--amber); }
  .persp-pick.faded{ opacity:0.28; transform:scale(0.94); }
  .persp-pick.gone{ opacity:0; transform:scale(0.8) translateY(-8px); pointer-events:none; }

  #pick-hint{
    position:absolute; left:50%; bottom:9vh; transform:translateX(-50%);
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.16em;
    color:var(--ink-dim); text-transform:uppercase; text-align:center;
    opacity:0; transition:opacity 1s ease 0.4s;
    z-index:15;
  }
  #pick-hint.visible{ opacity:0.75; }
  #pick-hint .arrow{ display:block; margin-top:10px; font-size:14px; animation:bob 2.2s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(6px); } }

  /* perspective switcher (small, appears once selection made) */
  #switcher{
    position:absolute; top:22px; right:34px; z-index:21;
    display:flex; gap:2px; opacity:0; transition:opacity 1s ease;
    font-family:'IBM Plex Mono', monospace;
  }
  #switcher.visible{ opacity:1; }
  #switcher button{
    background:transparent; border:1px solid var(--line); color:var(--ink-dim);
    font-family:inherit; font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
    padding:7px 11px; cursor:pointer; transition:all 0.3s ease;
  }
  #switcher button:hover{ color:var(--ink); border-color:var(--ink-dim); }
  #switcher button.active{ color:var(--amber); border-color:var(--amber); }

  /* narrative text panel */
  #narrative{
    position:absolute; left:0; bottom:0; z-index:18;
    width:100%; padding:0 34px 8vh 34px;
    pointer-events:none;
  }
  #narrative-inner{ max-width:640px; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.22em;
    color:var(--amber); text-transform:uppercase; margin-bottom:14px;
    opacity:0; transform:translateY(10px); transition:opacity 0.8s ease, transform 0.8s ease;
  }
  h1.scene-title{
    font-family:'Big Shoulders Display', sans-serif; font-weight:700;
    font-size:clamp(34px, 5.6vw, 68px); line-height:0.96; letter-spacing:0.01em;
    text-transform:uppercase; color:var(--ink); margin-bottom:16px;
    opacity:0; transform:translateY(14px); transition:opacity 0.9s ease 0.05s, transform 0.9s ease 0.05s;
  }
  p.scene-body{
    font-family:'IBM Plex Sans', sans-serif; font-weight:300; font-size:15.5px; line-height:1.62;
    color:var(--ink-dim); max-width:520px;
    opacity:0; transform:translateY(10px); transition:opacity 0.9s ease 0.12s, transform 0.9s ease 0.12s;
  }
  .scene-date{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.1em;
    color:var(--steel); margin-top:16px;
    opacity:0; transition:opacity 0.9s ease 0.2s;
  }
  #narrative.show .eyebrow,
  #narrative.show h1.scene-title,
  #narrative.show p.scene-body,
  #narrative.show .scene-date{ opacity:1; transform:translateY(0); }

  /* scroll progress rail */
  #rail{
    position:absolute; right:26px; top:50%; transform:translateY(-50%); z-index:18;
    height:34vh; width:1px; background:var(--line);
    opacity:0; transition:opacity 1s ease;
  }
  #rail.visible{ opacity:1; }
  #rail .fill{ position:absolute; top:0; left:0; width:100%; background:var(--amber); height:0%; box-shadow:0 0 8px var(--amber); }
  #rail .tick{
    position:absolute; right:10px; transform:translateY(-50%);
    font-family:'IBM Plex Mono', monospace; font-size:9px; letter-spacing:0.1em;
    color:var(--ink-dim); white-space:nowrap; text-transform:uppercase; opacity:0.6;
  }

  /* location labels (projected) */
  .loc-label{
    position:absolute; z-index:12; pointer-events:none;
    transform:translate(-50%,-100%);
    font-family:'IBM Plex Mono', monospace;
    text-align:center; white-space:nowrap;
    transition: opacity 0.6s ease;
  }
  .loc-label .dot{
    width:6px; height:6px; border-radius:50%; margin:0 auto 6px auto;
    background:var(--ink-dim); box-shadow:0 0 0 rgba(0,0,0,0);
    transition: all 0.6s ease;
  }
  .loc-label .name{
    font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-dim);
    transition:color 0.6s ease, font-size 0.6s ease;
  }
  .loc-label .tag{
    font-size:8.5px; letter-spacing:0.1em; color:var(--amber); opacity:0.85; margin-top:2px;
  }
  .loc-label.tier-context .dot{ background:var(--steel); }
  .loc-label.tier-context .name{ color:var(--steel); }
  .loc-label.tier-objective .dot{ background:var(--amber); box-shadow:0 0 8px var(--amber); }
  .loc-label.tier-objective .name{ color:var(--amber); font-size:11.5px; }
  .loc-label.tier-secured .dot{ background:#cdbf8d; box-shadow:0 0 8px #cdbf8d; }
  .loc-label.tier-secured .name{ color:var(--ink); }

  #intro-overlay{
    position:absolute; inset:0; z-index:14; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding-top:11vh;
    text-align:center;
    opacity:1; transition:opacity 1.1s ease;
  }
  #intro-overlay .kicker{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.32em;
    color:var(--ink-dim); text-transform:uppercase; margin-bottom:18px;
  }
  #intro-overlay h1{
    font-family:'Big Shoulders Display', sans-serif; font-weight:700;
    font-size:clamp(46px, 9vw, 108px); letter-spacing:0.02em; text-transform:uppercase;
    color:var(--ink); line-height:0.92;
  }
  #intro-overlay .sub{
    font-family:'IBM Plex Mono', monospace; font-size:12.5px; letter-spacing:0.2em;
    color:var(--amber); text-transform:uppercase; margin-top:16px;
  }

  #loading{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px;
    transition:opacity 0.9s ease;
  }
  #loading .bar{ width:220px; height:1px; background:var(--line); position:relative; overflow:hidden; }
  #loading .bar .fill{ position:absolute; left:0; top:0; height:100%; width:0%; background:var(--amber); transition:width 0.2s ease; }
  #loading .txt{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.2em; color:var(--ink-dim); text-transform:uppercase; }


  /* distributed story overlays: keep history visible across the terrain */
  #scene-card{
    position:absolute; right:34px; top:92px; z-index:22; width:min(360px,30vw);
    padding:16px 18px 15px; border:1px solid var(--line);
    background:linear-gradient(135deg,rgba(9,12,9,.78),rgba(9,12,9,.38));
    backdrop-filter:blur(8px); opacity:0; transform:translateY(-8px);
    transition:opacity .55s ease,transform .55s ease; pointer-events:none;
  }
  #scene-card.visible{opacity:1;transform:translateY(0)}
  #scene-card .mini-kicker{font:10px 'IBM Plex Mono',monospace;letter-spacing:.18em;color:var(--amber);text-transform:uppercase;margin-bottom:7px}
  #scene-card .mini-title{font:600 clamp(22px,2.6vw,34px)/.95 'Big Shoulders Display',sans-serif;text-transform:uppercase;color:var(--ink);margin-bottom:7px}
  #scene-card .mini-body{font-size:12.5px;line-height:1.5;color:var(--ink-dim)}
  #scene-card .mini-date{font:9px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:var(--steel);margin-top:10px}
  #chapter-strip{position:absolute;left:34px;top:84px;z-index:19;display:flex;gap:7px;pointer-events:none;opacity:0;transition:opacity .6s ease}
  #chapter-strip.visible{opacity:1}
  .chapter-pip{width:10px;height:10px;border-radius:50%;border:1px solid var(--line);background:rgba(231,228,216,.12);transition:all .35s ease}
  .chapter-pip.active{background:var(--amber);border-color:var(--amber);box-shadow:0 0 12px rgba(201,138,58,.8);transform:scale(1.25)}
  #event-feed{position:absolute;left:34px;top:112px;z-index:19;width:270px;opacity:0;transition:opacity .6s ease;pointer-events:none}
  #event-feed.visible{opacity:1}
  .event-line{font:10px/1.45 'IBM Plex Mono',monospace;color:var(--ink-dim);padding:7px 0;border-top:1px solid var(--line);opacity:.55;transition:opacity .35s ease,color .35s ease}
  .event-line.active{opacity:1;color:var(--ink)}
  .event-line b{color:var(--amber);font-weight:500}
  .loc-label .pulse{position:absolute;left:50%;top:3px;width:6px;height:6px;border-radius:50%;transform:translateX(-50%);border:1px solid var(--amber);opacity:0}
  .loc-label.tier-objective .pulse{opacity:.9;animation:markerPulse 2s ease-out infinite}
  .loc-label.tier-secured .pulse{opacity:.55;border-color:#cdbf8d;animation:markerPulse 2.8s ease-out infinite}
  .loc-label .tag{max-width:150px;margin-left:auto;margin-right:auto;white-space:normal;line-height:1.25}
  @keyframes markerPulse{0%{transform:translateX(-50%) scale(1);opacity:.85}100%{transform:translateX(-50%) scale(5);opacity:0}}
  #switcher button{position:relative;overflow:hidden}
  #switcher button::after{content:'';position:absolute;left:50%;right:50%;bottom:2px;height:1px;background:var(--amber);transition:left .25s ease,right .25s ease}
  #switcher button:hover::after,#switcher button.active::after{left:8px;right:8px}
  #switcher button:active{transform:translateY(1px);box-shadow:0 0 18px rgba(201,138,58,.2) inset}

  @media (max-width: 720px){
    #narrative{ padding:0 22px 6vh 22px; }
    p.scene-body{ font-size:14px; }
    #hud-top{ padding:16px 18px; }
    #hud-top .readout{ gap:14px; }
    #hud-top .readout span:nth-child(3){ display:none; }
    #rail{ display:none; }
    #scene-card{left:18px;right:18px;top:auto;bottom:18vh;width:auto;}
    #chapter-strip{left:18px;top:72px;}
    #event-feed{display:none;}
    #switcher{right:12px;top:58px;transform:scale(.9);transform-origin:top right;}
  }
  @media (prefers-reduced-motion: reduce){
    * { animation:none !important; transition:opacity 0.4s ease !important; }
  }
</style>
</head>
<body>

<audio id="bgMusic" preload="auto"></audio>

<div id="loading">
  <div class="txt" id="loading-txt">LOADING THEATRE</div>
  <div class="bar"><div class="fill" id="loading-fill"></div></div>
</div>

<div id="stage">
  <div id="canvas-wrap"></div>
  <div id="vignette"></div>
  <div id="scrim-bottom"></div>

  <div id="hud-top">
    <div class="brand">OPERATION VIJAY — KARGIL SECTOR</div>
    <div class="readout">
      <span>SEC <b id="hud-sector">DRAS</b></span>
      <span>ALT <b id="hud-alt">—</b></span>
      <span>PERSPECTIVE <b id="hud-persp">JOINT COMMAND</b></span>
    </div>
  </div>

  <div id="switcher">
    <button data-p="army">Army</button>
    <button data-p="airforce">Air Force</button>
    <button data-p="joint">Joint Command</button>
  </div>

  <div id="intro-overlay">
    <div class="kicker">A Scroll-Driven Retelling — Ladakh, 1999</div>
    <h1>Operation<br/>Vijay</h1>
    <div class="sub">Choose how you witness it</div>
  </div>

  <div id="perspective-layer"></div>
  <div id="pick-hint">Select a perspective<span class="arrow">▾</span></div>

  <div id="rail"><div class="fill"></div></div>

  <div id="loc-layer"></div>

  <div id="scene-card" aria-hidden="true">
    <div class="mini-kicker" id="mini-eyebrow"></div>
    <div class="mini-title" id="mini-title"></div>
    <div class="mini-body" id="mini-body"></div>
    <div class="mini-date" id="mini-date"></div>
  </div>
  <div id="chapter-strip" aria-hidden="true"></div>
  <div id="event-feed" aria-hidden="true"></div>

  <div id="narrative">
    <div id="narrative-inner">
      <div class="eyebrow" id="n-eyebrow">01 — Opening</div>
      <h1 class="scene-title" id="n-title">The Theatre</h1>
      <p class="scene-body" id="n-body"></p>
      <div class="scene-date" id="n-date"></div>
    </div>
  </div>
</div>

<div id="scroll-spacer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";

  /* ============================================================
     0. RESEARCHED NARRATIVE DATA (Operation Vijay, May–Jul 1999)
     ============================================================ */
  const SCENES = [
    {
      id:'opening', range:[0.00,0.04],
      eyebrow:'00 — The Theatre', title:'One Battlefield',
      body:'The Kargil sector of Ladakh, along the Line of Control. In the winter of 1998\u201399, this ground was empty of any front line.',
      date:''
    },
    {
      id:'geography', range:[0.04,0.12],
      eyebrow:'01 — Geography', title:'The Corridor',
      body:'National Highway 1D runs through Dras and Kargil \u2014 the only road linking Srinagar to Leh. On either side, ridgelines climb past 5,000 metres, ground so high and so cold both armies had traditionally left it unoccupied through winter.',
      date:'WINTER 1998\u201399'
    },
    {
      id:'infiltration', range:[0.12,0.22],
      eyebrow:'02 — Discovery', title:'The Infiltration',
      body:'Through the winter, Pakistani troops and irregulars crossed the Line of Control and occupied those vacated heights above Dras, Kaksar, Mushkoh and Batalik \u2014 positions overlooking NH1D itself. On 3 May, local shepherds in Batalik reported unusual movement on the ridgelines. By 5 May the Indian Army confirmed a deep, deliberate intrusion.',
      date:'3\u20135 MAY 1999'
    },
    {
      id:'mobilisation', range:[0.22,0.34],
      eyebrow:'03 — Response', title:'Operation Vijay',
      body:'On 10 May the Indian Army launched Operation Vijay to clear the heights. Artillery \u2014 including the Bofors howitzers, capable of high-angle fire into terrain other guns couldn\u2019t reach \u2014 began moving into the valley. On 26 May the Indian Air Force joined with Operation Safed Sagar, striking supply dumps and bunkers at altitudes no air force had fought at before.',
      date:'10 & 26 MAY 1999'
    },
    {
      id:'tololing', range:[0.34,0.50],
      eyebrow:'04 — Turning Point', title:'Tololing',
      body:'Overlooking the highway near Dras, Tololing had to fall before anything else could move. 2 Rajputana Rifles and 18 Grenadiers fought a three-week assault up its exposed slopes, much of it hand-to-hand in darkness. It fell on 13 June \u2014 the first major recapture of the war, and the moment the momentum turned.',
      date:'13 JUNE 1999'
    },
    {
      id:'batalik', range:[0.50,0.60],
      eyebrow:'05 — Expansion', title:'Batalik',
      body:'Batalik\u2019s heights were the most stubbornly held of all. Through June and into July, Indian troops fought to retake the Jubar heights and the ridgelines above Kaksar and Muntho Dhalo \u2014 the enemy\u2019s forward supply base \u2014 closing off any route toward Leh and the Siachen approaches.',
      date:'JUNE\u2013JULY 1999'
    },
    {
      id:'tigerhill', range:[0.60,0.84],
      eyebrow:'06 — Tiger Hill', title:'The Highest Peak',
      body:'At 5,307 metres, Tiger Hill commanded the entire Dras sector. Twenty-two artillery batteries bombarded it for thirteen hours before 18 Grenadiers, with the Sikh and Naga regiments, began a multi-pronged night assault on 3 July. Grenadier Yogendra Singh Yadav, wounded repeatedly, scaled the cliff face to silence a bunker at point-blank range \u2014 an action that earned the Param Vir Chakra. Tiger Hill fell after an eleven-hour battle on 4\u20135 July.',

      body:'By the fall of Tiger Hill, nearly 80% of the intruded territory had been cleared. Batalik\u2019s heights, the last and most stubborn sector, were secured through early July. On 11 July, following talks between President Clinton and Prime Minister Sharif, Pakistani forces began to withdraw. The war ended on 26 July 1999 \u2014 commemorated since as Kargil Vijay Diwas.',
      date:'11\u201326 JULY 1999'
    }
  ];

  // World-space locations. x/z are plan-position along the theatre;
  // elev is real approximate metres (used to derive terrain height & HUD readout).
  const LOCATIONS = [
    { id:'mushkoh', name:'Mushkoh Valley', x:-27, z:-56, elevM:3450, perm:true,
      states:[ {r:[0,1], tag:'', tier:'context'} ] },
    { id:'dras', name:'Dras', x:0, z:-40, elevM:3300, perm:true,

    { id:'pt4875', name:'Point 4875', x:-18, z:-27, elevM:4875,

        {r:[0.04,0.22], tag:'', tier:'context'},

    { id:'tololing', name:'Tololing', x:-11, z:-32, elevM:4900,

    { id:'tigerhill', name:'Tiger Hill', x:14, z:-37, elevM:5307,
      states:[

        {r:[0.84,1.0], tag:'Recaptured — 4–5 Jul', tier:'secured'}

    { id:'kargil', name:'Kargil', x:2, z:2, elevM:2676, perm:true,
      states:[ {r:[0,1], tag:'Town', tier:'context'} ] },
    { id:'kaksar', name:'Kaksar', x:20, z:8, elevM:3700,

        {r:[0.04,0.50], tag:'', tier:'context'},

    { id:'batalik', name:'Jubar Heights, Batalik', x:31, z:29, elevM:5000,
      states:[

     2. NOISE (hash-based value noise, fbm)
     ============================================================ */
  function hash(x,z){
    const s = Math.sin(x*127.1 + z*311.7)*43758.5453123;
    return s - Math.floor(s);
  }
  function noise2(x,z){
    const xi=Math.floor(x), zi=Math.floor(z);
    const xf=x-xi, zf=z-zi;
    const a=hash(xi,zi), b=hash(xi+1,zi), c=hash(xi,zi+1), d=hash(xi+1,zi+1);
    const u = xf*xf*(3-2*xf), v = zf*zf*(3-2*zf);
    return a*(1-u)*(1-v) + b*u*(1-v) + c*(1-u)*v + d*u*v;
  }
  function fbm(x,z,octaves){
    let total=0, amp=0.5, freq=1, sum=0;
    for(let i=0;i<octaves;i++){
      total += noise2(x*freq, z*freq)*amp;
      sum += amp;
      amp*=0.5; freq*=2.15;
    }
    return total/sum;
  }

  const ROAD = [
    [-27,-58],[-8,-44],[0,-40],[1,-15],[2,2],[10,14],[22,22],[31,29]
  ];
  function distToRoad(x,z){
    let best = 1e9;
    for(let i=0;i<ROAD.length-1;i++){
      const [x1,z1]=ROAD[i], [x2,z2]=ROAD[i+1];
      const dx=x2-x1, dz=z2-z1;
      const len2 = dx*dx+dz*dz || 1;
      let t = ((x-x1)*dx + (z-z1)*dz)/len2;
      t = Math.max(0, Math.min(1,t));
      const px = x1+t*dx, pz = z1+t*dz;
      const d = Math.hypot(x-px, z-pz);
      if(d<best) best=d;
    }
    return best;
  }

  function decodeDEM(b64){
    const bin = atob(b64);
    const buf = new ArrayBuffer(bin.length);
    const view = new Uint8Array(buf);
    for(let i=0;i<bin.length;i++) view[i] = bin.charCodeAt(i);
    return new Uint16Array(buf);
  }
  const DEM = decodeDEM(DEM_B64); // row-major, row0 = south, col0 = west
  if(DEM.length !== DEM_GRID * DEM_GRID){
    throw new Error(`DEM data size mismatch: expected ${DEM_GRID*DEM_GRID} samples, got ${DEM.length}`);
  }

  // sample real elevation (metres) at normalized u,v in [0,1] (u:west->east, v:south->north)
  function demMetres(u,v){
    u = Math.max(0, Math.min(1,u));
    v = Math.max(0, Math.min(1,v));
    const fx = u*(DEM_GRID-1), fy = v*(DEM_GRID-1);
    const x0 = Math.floor(fx), y0 = Math.floor(fy);
    const x1 = Math.min(DEM_GRID-1, x0+1), y1 = Math.min(DEM_GRID-1, y0+1);
    const tx = fx-x0, ty = fy-y0;
    const g = (xi,yi)=> DEM[yi*DEM_GRID+xi] / 65535;
    const a = g(x0,y0), b = g(x1,y0), c = g(x0,y1), d = g(x1,y1);
    const n = a*(1-tx)*(1-ty) + b*tx*(1-ty) + c*(1-tx)*ty + d*tx*ty;
    return DEM_VMIN + n*(DEM_VMAX-DEM_VMIN);
  }

  // (x: west->east like longitude, z: south->north like latitude)
  const WORLD_HALF = 100;
  function worldToUV(x,z){
    return {
      u: Math.max(0, Math.min(1, (x+WORLD_HALF)/(WORLD_HALF*2))),
      v: Math.max(0, Math.min(1, (z+WORLD_HALF)/(WORLD_HALF*2)))
    };

    const {u,v} = worldToUV(x,z);
    return demMetres(u,v);

    // OpenTopography Copernicus DEM embedded in DEM_B64.

        // Gentle documentary lighting; preserve recognisable satellite colours.
        vec3 n = normalize(vNormal);
        float diff = max(dot(n, uLightDir), 0.0);
        float light = 0.72 + diff*0.34;
        col *= light;

        // Restrained objective cue, kept subtle so the real imagery remains primary.
        float fd = distance(vWorldPos.xz, uFocus.xz);
        float glow = (1.0 - smoothstep(0.0, uFocusR, fd));
        col = mix(col, uFocusColor, glow * (0.05 + 0.04*sin(uTime*1.6)));

        // Atmospheric distance fog.
        float dist = length(cameraPosition - vWorldPos);
        float fog = 1.0 - exp(-uFogDensity*uFogDensity*dist*dist);
        col = mix(col, uFogColor, clamp(fog,0.0,1.0));

        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  const terrain = new THREE.Mesh(geo, terrainMat);
  scene.add(terrain);

  /* ============================================================
     4. AIRCRAFT (simple low-poly jet for IAF beats)
     ============================================================ */
  const jet = new THREE.Group();
  {
    const bodyMat = new THREE.MeshStandardMaterial({ color:0x6b7480, metalness:0.3, roughness:0.5 });
    const fuselage = new THREE.Mesh(new THREE.ConeGeometry(0.35, 3.2, 8), bodyMat);
    fuselage.rotation.x = Math.PI/2;
    jet.add(fuselage);
    const wing = new THREE.Mesh(new THREE.BoxGeometry(3.2,0.06,0.9), bodyMat);
    wing.position.z = 0.2;
    jet.add(wing);
    const tail = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.7,0.6), bodyMat);
    tail.position.set(0,0.35,1.4);
    jet.add(tail);
  }
  jet.visible = false;
  scene.add(jet);
  const JET_WINDOWS = [ [0.24,0.36], [0.62,0.80] ];
  const JET_PATH = [ [-40,20,-70], [35,16,-10] ]; // start/end world pos for a pass

  /* ============================================================
     5. CAMERA KEYFRAMES PER PERSPECTIVE
     ============================================================ */
  const SHARED_START = { t:0.00, pos:[0,55,70],  tgt:[0,9,-8],  fov:50 };

  const PATHS = {
    joint: [
      SHARED_START,
      { t:0.04,  pos:[0,50,64],   tgt:[0,9,-14],   fov:50 },
      { t:0.12,  pos:[-6,46,-2],  tgt:[-2,10,-20], fov:48 },
      { t:0.22,  pos:[-16,40,-6], tgt:[-10,11,-30],fov:47 },
      { t:0.34,  pos:[20,44,10], tgt:[2,11,-20],   fov:46 },
      { t:0.50,  pos:[-6,34,-46], tgt:[-11,14,-32],fov:44 },
      { t:0.60,  pos:[24,42,30],  tgt:[27,15,25],  fov:45 },
      { t:0.84,  pos:[19,37,-52], tgt:[14,16,-37], fov:42 },
      { t:1.00,  pos:[8,58,22],   tgt:[6,11,-14],  fov:50 }
    ],
    army: [
      SHARED_START,
      { t:0.04,  pos:[2,20,-4],   tgt:[0,10,-22],  fov:55 },
      { t:0.12,  pos:[0,14,-14],  tgt:[-2,12,-24], fov:58 },
      { t:0.22,  pos:[-6,10,-24], tgt:[-11,15,-29],fov:60 },
      { t:0.34,  pos:[-9,8,-27], tgt:[-11,11,-31], fov:66 },
      { t:0.50,  pos:[-15,9,-30], tgt:[-11,16,-30],fov:68 },
      { t:0.60,  pos:[22,9,20],   tgt:[26,14,26],  fov:66 },
      { t:0.84,  pos:[9,10,-41],  tgt:[14,18,-38], fov:70 },
      { t:1.00,  pos:[6,15,-19],  tgt:[10,16,-35], fov:58 }
    ],
    airforce: [
      SHARED_START,
      { t:0.04,  pos:[0,85,38],   tgt:[0,6,-20],   fov:40 },
      { t:0.12,  pos:[6,98,10],   tgt:[-2,6,-24],  fov:38 },
      { t:0.22,  pos:[11,112,-2],tgt:[-6,6,-30],   fov:37 },
      { t:0.34,  pos:[26,120,-22],tgt:[0,6,-25],   fov:35 },
      { t:0.50,  pos:[-11,95,-60],tgt:[-11,11,-31],fov:37 },
      { t:0.60,  pos:[28,100,50], tgt:[27,12,26],  fov:36 },
      { t:0.84,  pos:[21,90,-70], tgt:[14,13,-37], fov:37 },
      { t:1.00,  pos:[0,102,28],  tgt:[6,11,-12],  fov:40 }
    ]
  };
  let currentPerspective = null; // null until user picks
  const smoothed = { pos:new THREE.Vector3(0,55,70), tgt:new THREE.Vector3(0,9,-8), fov:50 };

  function smootherstep(x){ x=Math.max(0,Math.min(1,x)); return x*x*x*(x*(x*6-15)+10); }

  function evalPath(path, t){
    if(t<=path[0].t) return path[0];
    for(let i=0;i<path.length-1;i++){
      const a=path[i], b=path[i+1];
      if(t>=a.t && t<=b.t){
        const u = smootherstep((t-a.t)/(b.t-a.t || 1));
        return {
          pos:[0,1,2].map(k=>a.pos[k]+(b.pos[k]-a.pos[k])*u),
          tgt:[0,1,2].map(k=>a.tgt[k]+(b.tgt[k]-a.tgt[k])*u),
          fov: a.fov+(b.fov-a.fov)*u
        };
      }
    }
    return path[path.length-1];
  }
  /* bg music */

const bgMusic = document.getElementById('bgMusic');

bgMusic.volume = 0.25;

let userInteracted = false;
let audioReady = false;
let musicStarted = false;

async function prepareAudio() {
    try {
        console.log("Downloading full audio file...");

        // Download the complete MP3
        const response = await fetch('background.mp3');

        if (!response.ok) {
            throw new Error(`Failed to load audio: ${response.status}`);
        }

        const audioBlob = await response.blob();

        console.log(
            "Full audio downloaded:",
            (audioBlob.size / 1024 / 1024).toFixed(2),
            "MB"
        );

        // Give the complete file to the audio player
        const audioURL = URL.createObjectURL(audioBlob);
        bgMusic.src = audioURL;

        // Wait until duration is available
        await new Promise(resolve => {
            bgMusic.addEventListener(
                'loadedmetadata',
                resolve,
                { once: true }
            );
        });

        console.log("Audio duration:", bgMusic.duration);

        // Pick random position
        const randomStart =
            Math.random() * Math.max(1, bgMusic.duration - 5);

        console.log(
            "RANDOM POSITION:",
            randomStart.toFixed(2),
            "seconds"
        );

        // Seek
        bgMusic.currentTime = randomStart;

        // Wait until seeking actually completes
        await new Promise(resolve => {
            bgMusic.addEventListener(
                'seeked',
                resolve,
                { once: true }
            );
        });

        console.log(
            "SEEK COMPLETE:",
            bgMusic.currentTime.toFixed(2)
        );

        audioReady = true;
        tryPlay();

    } catch (error) {
        console.error("Audio preparation failed:", error);
    }
}

function tryPlay() {
    if (!userInteracted || !audioReady || musicStarted) return;

    musicStarted = true;

    bgMusic.play()
        .then(() => {
            console.log(
                "PLAYING FROM:",
                bgMusic.currentTime.toFixed(2)
            );
        })
        .catch(error => {
            musicStarted = false;
            console.error("Audio play failed:", error);
        });
}

// Unlock audio on first interaction anywhere
function unlockAudio() {
    userInteracted = true;
    console.log("User interaction detected");
    tryPlay();
}

document.addEventListener('pointerdown', unlockAudio, { once: true });
document.addEventListener('keydown', unlockAudio, { once: true });

// Start downloading immediately when website opens
prepareAudio();
  /* ============================================================
     6. SCROLL ENGINE (native scroll, smoothed)
     ============================================================ */
  let targetT = 0, curT = 0;
  function updateScrollTarget(){
    const max = document.getElementById('scroll-spacer').offsetHeight - window.innerHeight;
    targetT = Math.max(0, Math.min(1, window.scrollY / Math.max(1,max)));
  }
  window.addEventListener('scroll', updateScrollTarget, { passive:true });
  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    updateScrollTarget();
  });

  /* ============================================================
     7. PERSPECTIVE SELECTION UI
     ============================================================ */
  const perspLayer = document.getElementById('perspective-layer');
  const PICKS = [
    { key:'army', label:'Indian Army', sub:'Ground, valley, ascent', pos:{left:'22%', top:'70%'} },
    { key:'airforce', label:'Indian Air Force', sub:'Altitude, airspace', pos:{left:'50%', top:'20%'} },
    { key:'joint', label:'Joint Command', sub:'Strategic overview', pos:{left:'78%', top:'70%'} }
  ];
  PICKS.forEach(p=>{
    const el = document.createElement('div');
    el.className = 'persp-pick';
    el.style.left = p.pos.left; el.style.top = p.pos.top;
    el.innerHTML = `<div class="ring"></div><div class="label">${p.label}</div><div class="sub">${p.sub}</div>`;
    el.addEventListener('click', ()=> selectPerspective(p.key));
    perspLayer.appendChild(el);
    p.el = el;
  });

  const switcherEl = document.getElementById('switcher');
  switcherEl.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=> selectPerspective(b.dataset.p));
  });

  function selectPerspective(key){
    currentPerspective = key;
    document.getElementById('hud-persp').textContent =
      key==='army' ? 'INDIAN ARMY' : key==='airforce' ? 'INDIAN AIR FORCE' : 'JOINT COMMAND';

    PICKS.forEach(p=>{
      p.el.classList.toggle('selected', p.key===key);
      p.el.classList.toggle('faded', p.key!==key);
    });
    document.getElementById('pick-hint').classList.add('visible');
    switcherEl.classList.add('visible');
    switcherEl.querySelectorAll('button').forEach(b=> b.classList.toggle('active', b.dataset.p===key));

    // after a beat, fade the picker labels back (story takes over on scroll)
    clearTimeout(selectPerspective._t);
    selectPerspective._t = setTimeout(()=>{
      if(curT < 0.02){
        PICKS.forEach(p=> p.el.classList.toggle('faded', p.key!==key));
      }
    }, 260);
  }

  /* ============================================================
     8. LOCATION LABELS (projected each frame)
     ============================================================ */
  const locLayer = document.getElementById('loc-layer');
  LOCATIONS.forEach(l=>{
    const el = document.createElement('div');
    el.className = 'loc-label';
    el.innerHTML = `<div class="dot"></div><div class="pulse"></div><div class="name">${l.name}</div><div class="tag"></div>`;
    locLayer.appendChild(el);
    l.el = el;
    l.worldY = 0;
  });

  const _v = new THREE.Vector3();
  function updateLocationLabels(t){
    let focusPoint = null, focusR = 0;
    for(const l of LOCATIONS){
      const st = l.states.find(s=> t>=s.r[0] && t<s.r[1]) || l.states[l.states.length-1];
      const y = heightAt(l.x,l.z);
      _v.set(l.x, y+1.2, l.z).project(camera);
      const inView = _v.z < 1 && _v.z > -1;
      const sx = (_v.x*0.5+0.5)*window.innerWidth;
      const sy = (1-(_v.y*0.5+0.5))*window.innerHeight;
      const dist = camera.position.distanceTo(new THREE.Vector3(l.x,y,l.z));
      const visible = inView && !!st;
      const nearOK = dist < 130;
      if(visible && nearOK && sx>-100 && sx<window.innerWidth+100){
        l.el.style.opacity = st.tier==='context' && !l.perm ? '0.55' : '1';
        l.el.style.left = sx+'px';
        l.el.style.top = sy+'px';
        l.el.className = 'loc-label tier-'+st.tier;
        l.el.querySelector('.tag').textContent = st.tag||'';
      } else {
        l.el.style.opacity = '0';
      }
      if(st.tier==='objective'){
        focusPoint = l; focusR = 22;
      }
    }
    if(focusPoint){
      terrainMat.uniforms.uFocus.value.set(focusPoint.x, 0, focusPoint.z);
      terrainMat.uniforms.uFocusR.value += (focusR - terrainMat.uniforms.uFocusR.value)*0.06;
    } else {
      terrainMat.uniforms.uFocusR.value += (0 - terrainMat.uniforms.uFocusR.value)*0.06;
    }
  }

  /* ============================================================
     9. NARRATIVE TEXT SYNC
     ============================================================ */
  const narrEl = document.getElementById('narrative');
  const elEyebrow = document.getElementById('n-eyebrow');
  const elTitle = document.getElementById('n-title');
  const elBody = document.getElementById('n-body');
  const elDate = document.getElementById('n-date');
  let activeSceneId = null;

  function currentScene(t){
    return SCENES.find(s=> t>=s.range[0] && t<s.range[1]) || SCENES[SCENES.length-1];
  }
  function updateNarrative(t){
    const s = currentScene(t);
    if(s.id !== activeSceneId){
      activeSceneId = s.id;
      narrEl.classList.remove('show');
      setTimeout(()=>{
        elEyebrow.textContent = s.eyebrow;
        elTitle.textContent = s.title;
        elBody.textContent = s.body;
        elDate.textContent = s.date;
        document.getElementById('mini-eyebrow').textContent = s.eyebrow;
        document.getElementById('mini-title').textContent = s.title;
        document.getElementById('mini-body').textContent = s.body;
        document.getElementById('mini-date').textContent = s.date;
        const isOpening = s.id==='opening';
        narrEl.style.visibility = isOpening ? 'hidden' : 'visible';
        document.getElementById('scene-card').classList.toggle('visible', !isOpening);
        document.getElementById('chapter-strip').classList.toggle('visible', !isOpening);
        document.getElementById('event-feed').classList.toggle('visible', !isOpening);
        void narrEl.offsetWidth;
        narrEl.classList.add('show');
      }, s.id==='opening'?0:180);
    }
  }


  /* ============================================================
     9.5 DISTRIBUTED STORY UI
     ============================================================ */
  const chapterStrip = document.getElementById('chapter-strip');
  const eventFeed = document.getElementById('event-feed');
  SCENES.filter(s=>s.id!=='opening').forEach((s,i)=>{
    const pip=document.createElement('div'); pip.className='chapter-pip'; pip.title=s.title; pip.dataset.scene=s.id; chapterStrip.appendChild(pip);
  });
  const EVENTS=[
    {at:0.12,date:'03–05 MAY',text:'Intrusion reported and confirmed'},
    {at:0.22,date:'10 MAY',text:'Operation Vijay begins'},
    {at:0.28,date:'26 MAY',text:'Operation Safed Sagar joins'},
    {at:0.34,date:'13 JUN',text:'Tololing recaptured'},
    {at:0.50,date:'JUN–JUL',text:'Batalik heights contested'},
    {at:0.60,date:'03–05 JUL',text:'Tiger Hill assault'},
    {at:0.84,date:'26 JUL',text:'Kargil Vijay Diwas'}
  ];
  EVENTS.forEach(e=>{const d=document.createElement('div');d.className='event-line';d.dataset.at=e.at;d.innerHTML=`<b>${e.date}</b> — ${e.text}`;eventFeed.appendChild(d)});
  function updateDistributedStory(t){
    const active=currentScene(t).id;
    chapterStrip.querySelectorAll('.chapter-pip').forEach(p=>p.classList.toggle('active',p.dataset.scene===active));
    eventFeed.querySelectorAll('.event-line').forEach(line=>line.classList.toggle('active',t>=Number(line.dataset.at) && t<Number(line.dataset.at)+0.16));
  }

  /* ============================================================
     10. HUD + RAIL
     ============================================================ */
  let railFill = document.querySelector('#rail .fill');
  if(!railFill){
    railFill = document.createElement('div');
    railFill.className = 'fill';
    rail.appendChild(railFill);
  }
  const hudTop = document.getElementById('hud-top');
  const hudSector = document.getElementById('hud-sector');
  const hudAlt = document.getElementById('hud-alt');
  function nearestSector(x,z){
    let best=null, bd=1e9;
    for(const l of LOCATIONS){
      const d = Math.hypot(x-l.x, z-l.z);
      if(d<bd){ bd=d; best=l; }
    }
    return best ? best.name : '—';
  }

  /* ============================================================
     11. INTRO OVERLAY FADE + LOADING
     ============================================================ */
  const introOverlay = document.getElementById('intro-overlay');
  const pickHint = document.getElementById('pick-hint');
  const rail = document.getElementById('rail');
  SCENES.forEach((s)=>{
    const t = document.createElement('div');
    t.className='tick';
    t.textContent = s.eyebrow.replace(/^\d+\s*—\s*/,'').toUpperCase();
    t.style.top = (s.range[0]*100)+'%';
    rail.appendChild(t);
  });

  /* ============================================================
     12. RENDER LOOP
     ============================================================ */
  let clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    terrainMat.uniforms.uTime.value += dt;

    curT += (targetT-curT)*Math.min(1, dt*4.2);

    const pathKey = currentPerspective || 'joint';
    const frame = evalPath(PATHS[pathKey], curT);
    smoothed.pos.lerp(new THREE.Vector3(...frame.pos), Math.min(1,dt*3.6));
    smoothed.tgt.lerp(new THREE.Vector3(...frame.tgt), Math.min(1,dt*3.6));
    smoothed.fov += (frame.fov - smoothed.fov)*Math.min(1,dt*3.6);

    // tiny ambient handheld sway, independent of scroll
    const time = performance.now()*0.00016;
    const sway = new THREE.Vector3(Math.sin(time*1.3)*0.35, Math.cos(time*1.05)*0.22, Math.sin(time*0.8)*0.3);

    // Keep camera and look target above the real DEM. Some original keyframes
    // were authored for procedural terrain and can otherwise end up underground.
    const cameraGround = heightAt(smoothed.pos.x, smoothed.pos.z);
    const targetGround = heightAt(smoothed.tgt.x, smoothed.tgt.z);
    const safeCameraY = Math.max(smoothed.pos.y, cameraGround + 3.5);
    const safeTargetY = Math.max(smoothed.tgt.y, targetGround + 0.6);

    camera.position.set(
      smoothed.pos.x + sway.x,
      safeCameraY + sway.y,
      smoothed.pos.z + sway.z
    );
    camera.lookAt(smoothed.tgt.x, safeTargetY, smoothed.tgt.z);
    camera.fov = smoothed.fov;
    camera.updateProjectionMatrix();

    // opening overlay + pick UI visibility
    const introOpacity = 1 - smootherstep(curT/0.045);
    introOverlay.style.opacity = introOpacity;
    introOverlay.style.pointerEvents = curT<0.04 ? 'auto':'none';
    if(curT>0.05){
      pickHint.classList.remove('visible');
      document.querySelectorAll('.persp-pick').forEach(el=> el.classList.add('gone'));
    } else if(currentPerspective){
      document.querySelectorAll('.persp-pick').forEach(el=> el.classList.remove('gone'));
    }
    hudTop.classList.toggle('visible', curT>0.015);
    rail.classList.toggle('visible', curT>0.03);
    railFill.style.height = (curT*100)+'%';

    updateNarrative(curT);
    updateDistributedStory(curT);
    updateLocationLabels(curT);

    // jet
    let jetActive = null;
    for(const w of JET_WINDOWS){ if(curT>=w[0] && curT<=w[1]) jetActive=w; }
    if(jetActive){
      const u = (curT-jetActive[0])/(jetActive[1]-jetActive[0]);
      const p0=JET_PATH[0], p1=JET_PATH[1];
      const x = p0[0]+(p1[0]-p0[0])*u, z = p0[2]+(p1[2]-p0[2])*u;
      const y = heightAt(x,z) + 14 + Math.sin(u*Math.PI)*4;
      jet.position.set(x,y,z);
      jet.rotation.y = Math.atan2(p1[0]-p0[0], p1[2]-p0[2]);
      jet.rotation.z = Math.sin(time*2)*0.05;
      jet.visible = true;
    } else {
      jet.visible = false;
    }

    // HUD readouts
    hudSector.textContent = nearestSector(camera.position.x, camera.position.z).toUpperCase();
    // Display real ground elevation from the Copernicus DEM, not camera height.
    hudAlt.textContent = Math.round(groundMetresAtWorld(camera.position.x, camera.position.z)).toLocaleString()+' M';

    renderer.render(scene, camera);
  }

  /* ============================================================
     13. BOOT
     ============================================================ */
  function boot(){
    updateScrollTarget();
    animate();
    const loading = document.getElementById('loading');
    loading.style.opacity='0';
    setTimeout(()=> loading.style.display='none', 950);
  }

  // Lightweight loading progress while the already-embedded DEM and scene initialise
  const fill = document.getElementById('loading-fill');
  let p=0;
  const iv = setInterval(()=>{
    p += (100-p)*0.18 + 1.2;
    if(p>=99){ p=100; clearInterval(iv); boot(); }
    fill.style.width = p+'%';
  }, 60);

})();
